<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EnteKSRTC Basic - Login</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="navbar-brand">🚌 EnteKSRTC</div>
    <div class="navbar-links">
      <a href="index.html">Home</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="buses.html">Search Buses</a>
      <a href="bookings.html">My Bookings</a>
      <a href="login.html" id="navAuthLink">Login / Register</a>
    </div>
  </nav>

  <div class="container">
    <div class="auth-card">
      <h2>Login</h2>

      <form id="loginForm" class="auth-form">
        <div class="form-group">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" required />
        </div>

        <div class="form-group">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="Your password" required />
        </div>

        <div id="loginMessage" class="form-message hidden"></div>

        <button type="submit" id="loginSubmitBtn" class="btn btn-primary btn-full">Login</button>
      </form>

      <p class="auth-switch">Don't have an account? <a href="register.html">Register here</a></p>
    </div>
  </div>

  <footer class="site-footer">EnteKSRTC Basic &mdash; Educational project, no real payments involved.</footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
