<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EnteKSRTC Basic - Select Seat</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="navbar-brand">🚌 EnteKSRTC</div>
    <div class="navbar-links">
      <a href="index.html">Home</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="buses.html">Search Buses</a>
      <a href="bookings.html">My Bookings</a>
      <a href="login.html" id="navAuthLink">Login / Register</a>
    </div>
  </nav>

  <div class="container">
    <h2 class="section-heading">Select Your Seat</h2>

    <div class="booking-summary">
      <p id="bookingBusSummary">Loading bus details...</p>
      <p>Fare: <strong id="bookingFare">-</strong></p>
    </div>

    <div class="seat-map-wrapper">
      <div class="driver-label">🚗 Driver</div>
      <div id="seatMap"></div>

      <div class="seat-legend">
        <span><span class="legend-swatch legend-available"></span>Available</span>
        <span><span class="legend-swatch legend-selected"></span>Selected</span>
        <span><span class="legend-swatch legend-booked"></span>Booked</span>
      </div>
    </div>

    <form id="bookingForm" class="auth-form" style="max-width: 480px;">
      <div class="form-group">
        <label>Selected Seat</label>
        <p><strong id="selectedSeatLabel">None yet</strong></p>
      </div>

      <div class="form-group">
        <label for="passengerName">Passenger Name</label>
        <input type="text" id="passengerName" placeholder="Full name of passenger" required />
      </div>

      <div class="form-group">
        <label for="bookingJourneyDate">Journey Date</label>
        <input type="date" id="bookingJourneyDate" required />
      </div>

      <div id="bookingMessage" class="form-message hidden"></div>

      <button type="submit" id="confirmBookingBtn" class="btn btn-primary" disabled>
        Confirm Booking
      </button>
    </form>
  </div>

  <footer class="site-footer">EnteKSRTC Basic &mdash; Educational project, no real payments involved.</footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/booking.js"></script>
</body>
</html>
