<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EnteKSRTC Basic - Register</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="navbar-brand">🚌 EnteKSRTC</div>
    <div class="navbar-links">
      <a href="index.html">Home</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="buses.html">Search Buses</a>
      <a href="bookings.html">My Bookings</a>
      <a href="login.html" id="navAuthLink">Login / Register</a>
    </div>
  </nav>

  <div class="container">
    <div class="auth-card">
      <h2>Create an Account</h2>

      <form id="registerForm" class="auth-form">
        <div class="form-group">
          <label for="regName">Name</label>
          <input type="text" id="regName" placeholder="Your full name" required />
        </div>

        <div class="form-group">
          <label for="regEmail">Email</label>
          <input type="email" id="regEmail" placeholder="you@example.com" required />
        </div>

        <div class="form-group">
          <label for="regPassword">Password</label>
          <input type="password" id="regPassword" placeholder="At least 6 characters" required />
        </div>

        <div class="form-group">
          <label for="regConfirmPassword">Confirm Password</label>
          <input type="password" id="regConfirmPassword" placeholder="Re-enter password" required />
        </div>

        <div id="registerMessage" class="form-message hidden"></div>

        <button type="submit" id="registerSubmitBtn" class="btn btn-primary btn-full">Register</button>
      </form>

      <p class="auth-switch">Already have an account? <a href="login.html">Login here</a></p>
    </div>
  </div>

  <footer class="site-footer">EnteKSRTC Basic &mdash; Educational project, no real payments involved.</footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
